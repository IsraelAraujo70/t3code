name: friend fork

on:
  push:
    branches: ["friend/**"]
  pull_request:
    branches: ["friend/main"]

permissions:
  contents: read

jobs:
  seams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check fork seams
        run: node scripts/friend/check-seams.ts
